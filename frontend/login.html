<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login / Register</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <header></header>
  <main class="container" style="max-width: 480px;">
    <div class="auth-box">
      <div style="display:flex;gap:0.5rem;margin-bottom:1.25rem;">
        <button id="show-login" class="btn">Login</button>
        <button id="show-register" class="btn btn-secondary">Register</button>
      </div>

      <form id="auth-form">
        <div id="name-group" class="form-group" style="display:none;">
          <label for="name">Full Name</label>
          <input type="text" id="name" placeholder="Your name" />
        </div>
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" required placeholder="you@example.com" />
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" required placeholder="Min 6 characters" />
        </div>
        <button type="submit" id="submit-btn" class="btn" style="width:100%;">Login</button>
      </form>
      <p id="auth-msg" class="msg"></p>
    </div>
  </main>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
